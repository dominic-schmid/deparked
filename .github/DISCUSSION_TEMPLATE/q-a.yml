body:
  - type: markdown
    attributes:
      value: |
        Discussions are public. Leave out Cloudflare tokens, setup links, account IDs and anything about buyers.
        Something broken? [Report a problem](https://github.com/dominic-schmid/deparked/issues/new/choose) instead.
  - type: textarea
    attributes:
      label: What are you trying to do?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    attributes:
      label: Deparked version
      description: Settings → Updates in your admin. Leave empty if you have not installed yet.
      placeholder: "0.1.5"
  - type: dropdown
    attributes:
      label: Where
      options:
        - Installing
        - Adding or removing a domain
        - Editing or publishing a page
        - Offers and email
        - Updates
        - Something else
    validations:
      required: true
