name: CI

on:
  pull_request:
  push:
    branches: [main]

# No secrets and no deploys: CI never gets Cloudflare credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Committed installer bundle is up to date
        run: pnpm check:install-fresh
      - name: wrangler deploy --dry-run (install, sites, admin)
        run: pnpm dry-run
